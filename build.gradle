buildscript {
    repositories {
        maven { url = "http://files.minecraftforge.net/maven" }
        maven { url = 'https://repo.spongepowered.org/maven' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'
//Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = "1.2.2-For0.3.2"
group = "com.fuskirby.dojutsu_slot" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "dojutsu_slot"

sourceCompatibility = targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
}

minecraft {
    version = "1.12.2-14.23.5.2847"
    runDir = "run"

    mappings = "snapshot_20171003"
}

mixin {
    add sourceSets.main, "mixins.dojutsu_slot.refmap.json"
}

repositories {
    maven {
        url = "https://cursemaven.com"
    }
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url = "https://repo.spongepowered.org/maven"
    }
}

dependencies {
    compile "curse.maven:mixin-booter-419286:7049694"
    compile files("libs/narutomod-0.3.2-beta.jar")
    //compileOnly files("libs/The_Shinobi_Way_V1.2.jar")
    //compileOnly files("libs/SpringAddon7.0.jar")
    compileOnly "curse.maven:anbu-bingo-book-for-ahznbs-shinobicraft-949952:6882632"
    compileOnly "curse.maven:springaddon-980403:5744456"
    compileOnly "curse.maven:the-shinobi-way-raba-addon-ahznb-narutomod-1089964:6807223"
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else except the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
